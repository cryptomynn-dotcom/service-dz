<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service DZ - KHABIR TECH</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #10b981;
            --dark: #1e293b;
            --light: #f8fafc;
            --accent: #f59e0b;
            --glass: rgba(255, 255, 255, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #e2e8f0; color: var(--dark); line-height: 1.6; }

        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: var(--light);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-bottom: 80px;
        }

        /* Top Bar */
        .header {
            background: var(--glass);
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e2e8f0;
        }

        .logo { font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--primary), #1e40af);
            padding: 40px 20px;
            color: white;
            border-radius: 0 0 30px 30px;
            text-align: center;
            margin-bottom: 20px;
        }

        .hero h1 { font-size: 28px; margin-bottom: 10px; }

        /* Form Styling */
        .card {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            background: #f8fafc;
            transition: all 0.3s;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--primary); background: white; }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--secondary); color: white; }

        /* Bottom Nav */
        .nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            height: 70px;
            background: var(--glass);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #e2e8f0;
        }

        .nav-item { border: none; background: none; font-size: 24px; color: #94a3b8; cursor: pointer; }
        .nav-item.active { color: var(--primary); }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header"><div class="logo">SERVICE DZ</div></header>

    <!-- Main Screen -->
    <div id="home">
        <div class="hero">
            <h1>أهلاً بك</h1>
            <p>ابحث عن حرفيين محترفين في ولايتك</p>
        </div>
        <div style="padding: 10px;">
            <button class="btn btn-primary" onclick="goTo('client-reg')">أنا أبحث عن خدمة</button>
            <button class="btn btn-secondary" onclick="goTo('pro-reg')">تسجيل كحرفي مهني</button>
        </div>
    </div>

    <!-- Pro Registration -->
    <div id="pro-reg" class="hidden page">
        <div class="card">
            <h2 style="margin-bottom: 20px;">تسجيل حرفي</h2>
            <div class="input-group">
                <input type="text" id="p-name" placeholder="اسم المحل / اسمك الشخصي">
            </div>
            <div class="input-group">
                <input type="tel" id="p-phone" placeholder="رقم الهاتف (05/06/07)">
            </div>
            <div class="input-group">
                <select id="p-craft">
                    <option value="">اختر المهنة</option>
                    <option>مصلح مبردات - Frigoriste</option>
                    <option>مصلح مكيفات - Climatisation</option>
                    <option>كهربائي - Electricien</option>
                    <option>سباك - Plombier</option>
                    <option>نجار - Menuisier</option>
                </select>
            </div>
            <div class="input-group">
                <select id="p-wilaya" onchange="updateCities('p-wilaya', 'p-city')">
                    <option value="">اختر الولاية</option>
                </select>
            </div>
            <div class="input-group">
                <select id="p-city">
                    <option value="">اختر البلدية</option>
                </select>
            </div>
            <button class="btn btn-secondary" onclick="handleSave()">تأكيد الحساب</button>
            <button class="btn" style="background: #e2e8f0;" onclick="goTo('home')">إلغاء</button>
        </div>
    </div>

    <nav class="nav">
        <button class="nav-item active" onclick="goTo('home')">🏠</button>
        <button class="nav-item" onclick="goTo('search')">🔍</button>
        <button class="nav-item">👤</button>
    </nav>
</div>

<script>
    // بيانات الولايات والبلديات (مثال ويمكنك التوسع)
    const dataDZ = {
        "06-بجاية": ["بجاية", "أقبو", "أوقاس", "خراطة", "تيشي"],
        "13-تلمسان": ["تلمسان", "مغنية", "الغزوات", "منصورة"],
        "18-جيجل": ["جيجل", "الطاهير", "الميلية", "جيملة"],
        "16-الجزائر": ["الجزائر الوسطى", "الحراش", "الرويبة", "باب الوادي"],
        "19-سطيف": ["سطيف", "العلمة", "عين أرنات"]
    };

    window.onload = function() {
        const wilayaSelect = document.getElementById('p-wilaya');
        for (let w in dataDZ) {
            let opt = document.createElement('option');
            opt.value = w; opt.text = w;
            wilayaSelect.add(opt);
        }
    };

    function updateCities(wId, cId) {
        const wVal = document.getElementById(wId).value;
        const cSelect = document.getElementById(cId);
        cSelect.innerHTML = '<option value="">اختر البلدية</option>';
        if (dataDZ[wVal]) {
            dataDZ[wVal].forEach(city => {
                let opt = document.createElement('option');
                opt.value = city; opt.text = city;
                cSelect.add(opt);
            });
        }
    }

    function goTo(id) {
        document.querySelectorAll('.app-container > div').forEach(p => {
            if(p.id !== 'home' || id !== 'home') p.classList.add('hidden');
        });
        document.getElementById(id).classList.remove('hidden');
        if(id === 'home') document.querySelector('.hero').parentElement.classList.remove('hidden');
    }

    function handleSave() {
        const phone = document.getElementById('p-phone').value;
        if(phone.length < 10) {
            alert("يرجى التأكد من رقم الهاتف");
            return;
        }
        alert("تم التسجيل بنجاح في Service DZ!");
        goTo('home');
    }
</script>
</body>
</html>
